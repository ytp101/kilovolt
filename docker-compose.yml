services:
  kilovolt:
    image: ${KILOVOLT_IMAGE:-yodsarun/kilovolt-proxy:v1.3.2}
    container_name: kilovolt
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KILOVOLT_HOST_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      BIND_ADDR: 0.0.0.0
      KILOVOLT_PORT: 8080
      KILOVOLT_ACKNOWLEDGE_PROCESS_LOCAL_LEDGER: "true"
    stop_grace_period: 30s
