name: Manual Benchmark

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Run the short smoke suite instead of the full suite
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Run benchmark
        shell: bash
        run: |
          if [[ "${{ inputs.smoke }}" == "true" ]]; then
            python3 scripts/benchmark/run.py --smoke
          else
            python3 scripts/benchmark/run.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kilovolt-benchmark-results
          path: benchmark-results/*.json
